[[modules]]
file_path = "game/deadspace_game_f.xex"
out_directory_path = "generated/game"
guest_path = "deadspace_game_f.xex"
includes = []

# Names and hints for the codegen (tools/codegen.sh adds them to the manifest). Addresses are the TU1 image's
# (deadspace_game_f.xex 0.0.1.2).
#
# The game's setjmp and longjmp (DS2: setjmp_8295ED20, longjmp_8295EA00; matched by body). Named here the codegen turns
# their call sites into ppc_setjmp / ppc_longjmp: without them a longjmp (a Lua error, a bad PNG or JPEG, the XGraphics
# microcode compiler's error path) returned to its caller instead of to its setjmp. These keys belong to the module's
# own table: tools/codegen.sh puts this file right under the [[modules]] header.
setjmp_address = 0x88C99620
longjmp_address = 0x88C991F0

# Names for the functions the Switch code hooks, found by matching function bodies against Dead Space 2's PDB-named
# recompiled tree (tools/match_funcs.py: 5,460 of DS2's names match a DS3 function exactly; tools/fuzzy_find.py for
# the rest). CMake compiles each hook only when its names are here.

# XDK Direct3D: every shader the game creates (src/ds3_shader_dump.cpp). DS2: 0x82220568 / 0x822201C0. Prefixed: the
# SDK exports stubs named __imp__D3DDevice_Create*Shader, and a bare name would make the game's function that stub.
[modules.functions.0x88A2D910]
name = "ds3_D3DDevice_CreateVertexShader"

[modules.functions.0x88A2D728]
name = "ds3_D3DDevice_CreatePixelShader"

# XDK: shaders built in place, with no Create*Shader (src/ds3_shader_dump.cpp). DS2: 0x82220470 / 0x82220188.
[modules.functions.0x88A2D818]
name = "ds3_XGRegisterVertexShader"

[modules.functions.0x88A2CEF0]
name = "ds3_XGRegisterPixelShader"

# The Win32 SetThreadPriority (src/ds3_game_cpu.cpp). DS2: SetThreadPriority_8237C0B0, exact body match.
[modules.functions.0x88BA72D0]
name = "ds3_SetThreadPriority"

# Direct3D's "is the GPU there yet" step (src/ds3_game_cpu.cpp): 4 x 8 db16cyc, then a look at the GPU's progress; 1
# while still waiting, and its callers (BlockOnFence and five more) call it again. gears2-nx's sub_82977688, same body.
[modules.functions.0x88A20950]
name = "ds3_D3D_GpuWaitStep"

# The game's display setup (src/ds3_resolution.cpp): writes the scene size the whole renderer reads (u16 0x890B1378
# width, 0x890B137C height: 1152x720 in HD, 1024x768 in SD) and the back buffer's (1280x720 / 640x480).
[modules.functions.0x8895BAE0]
name = "ds3_ConfigureDisplay"

# RenderWare Audio's final compressor (src/ds3_audio.cpp): the plug-in Process Mixer::Execute calls, hot in run 6.
[modules.functions.0x886C6ED8]
name = "ds3_rw_audio_Compressor1_Process"

# The audio threads' loops (src/ds3_audio.cpp: each raises its thread above the game's once). RenderWare Audio's mixer
# thread loop (four threads in run 20: two mix through MixWithGain, two through another DSP path) and the two XAudio
# threads the Audio Worker's callback waits on (thread entries, reached only through the function table).
[modules.functions.0x886A8910]
name = "ds3_rw_audio_MixerThreadLoop"

[modules.functions.0x88BD2DE8]
name = "ds3_xaudio_ThreadA"

[modules.functions.0x88BD2E48]
name = "ds3_xaudio_ThreadB"

# RenderWare Audio's mixer leaf loops (src/ds3_audio.cpp: NEON versions), byte for byte Dead Space 2's.
[modules.functions.0x886BE8E8]
name = "rw__audio__core__MixWithGain"

[modules.functions.0x886B56C8]
name = "rw__audio__core__CopyWithGain"

