[project]
name = "ds3"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = []

# Names and hints for default.xex (the title, 0x82000000; TU1 0.0.1.x), as names.toml is for the game module.

# Branch targets the codegen's analysis does not find on its own (tools/codegen.sh lists them; ADD_UNRESOLVED=1).

